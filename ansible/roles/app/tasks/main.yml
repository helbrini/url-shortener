- name: Créer le dossier
  ansible.builtin.file:
    path: "{{ app_dir }}"
    state: directory
    mode: "0755"

- name: Générer la configuration depuis le template
  ansible.builtin.template:
    src: app.conf.j2
    dest: "{{ app_dir }}/app.conf"
    mode: "0644"
  notify: Recharger l'application

- name: Générer le fichier d'environnement avec le secret
  ansible.builtin.copy:
    dest: "{{ app_dir }}/app.env"
    content: |
      DATABASE_URL=postgresql://shortener:{{ db_password }}@db:5432/shortener
    mode: "0600"
  no_log: true
