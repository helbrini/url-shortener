name: Publish image

on:
  push:
    branches: [main]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build image
        run: |
          docker build \
            -t ghcr.io/${{ github.repository_owner }}/url-shortener:${{ github.sha }} \
            -t ghcr.io/${{ github.repository_owner }}/url-shortener:latest .

      - name: Push image
        run: docker push --all-tags ghcr.io/${{ github.repository_owner }}/url-shortener
